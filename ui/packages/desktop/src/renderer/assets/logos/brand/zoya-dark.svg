<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background: Very dark indigo base -->
  <rect x="4" y="4" width="92" height="92" rx="24" fill="#0f0d23" />

  <!-- Gradient Stroke Border (to simulate glow) -->
  <defs>
    <linearGradient id="zoyaDarkBorderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8;stop-opacity:1" /> <!-- Indigo 400 -->
      <stop offset="30%" style="stop-color:#a78bfa;stop-opacity:1" /> <!-- Violet 400 -->
      <stop offset="70%" style="stop-color:#c084fc;stop-opacity:1" /> <!-- Purple 400 -->
      <stop offset="100%" style="stop-color:#f472b6;stop-opacity:1" /> <!-- Pink 400 -->
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="100" height="100" rx="24" fill="none" stroke="url(#zoyaDarkBorderGradient)" stroke-width="4" />

  <!-- Custom Z Path (Ribbon effect) -->
  <!-- M28 30 L72 30 L36 38 L64 62 L28 70 L64 62 L36 38 L28 38 Z -->
  <path
    d="M28 30 L72 30 L36 38 L64 62 L28 70 L64 62 L36 38 L28 38 Z"
    stroke="#e0e7ff"
    stroke-width="10"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- Glow Dot Accent -->
  <circle cx="76" cy="76" r="5" fill="#ddd6fe" /> <!-- Purple 200 -->
  <circle cx="76" cy="76" r="2" fill="#e0f2f1" /> <!-- Teal 50 -->
</svg>