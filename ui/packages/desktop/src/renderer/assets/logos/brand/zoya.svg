<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background: Rounded rectangle with rich gradient -->
  <defs>
    <linearGradient id="zoyaBgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" /> <!-- Indigo 500 -->
      <stop offset="30%" style="stop-color:#8b5cf6;stop-opacity:1" /> <!-- Violet 500 -->
      <stop offset="70%" style="stop-color:#a855f7;stop-opacity:1" /> <!-- Purple 500 -->
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" /> <!-- Pink 500 -->
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="92" height="92" rx="24" fill="url(#zoyaBgGradient)" />

  <!-- Custom Z Path (Ribbon effect, stroke-linecap="round" is implied by path drawing) -->
  <!-- M28 30 L72 30 L36 38 L64 62 L28 70 L64 62 L36 38 L28 38 Z -->
  <path
    d="M28 30 L72 30 L36 38 L64 62 L28 70 L64 62 L36 38 L28 38 Z"
    stroke="#FFFFFF"
    stroke-width="10"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- Glow Dot Accent -->
  <circle cx="76" cy="76" r="5" fill="#fbcfe8" /> <!-- Pink 200 -->
  <circle cx="76" cy="76" r="2" fill="white" />
</svg>