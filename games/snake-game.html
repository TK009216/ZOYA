<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🐍 NEON SNAKE</title>
    <style>
        /* ========== RESET & BASE ========== */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
            touch-action: none;
        }

        /* ========== GAME WRAPPER ========== */
        #gameWrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            padding: 10px;
        }

        /* ========== TITLE ========== */
        #title {
            font-size: 2rem;
            font-weight: bold;
            color: #00ff88;
            text-shadow: 0 0 20px rgba(0, 255, 136, 0.6), 0 0 40px rgba(0, 255, 136, 0.3);
            letter-spacing: 6px;
            text-transform: uppercase;
        }
        #title span {
            display: inline-block;
            animation: glowPulse 2s ease-in-out infinite;
        }

        /* ========== HUD ========== */
        #hud {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 500px;
            padding: 8px 12px;
            color: #00ff88;
            font-size: 1.1rem;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
            border: 1px solid rgba(0, 255, 136, 0.15);
            border-radius: 8px;
            background: rgba(0, 255, 136, 0.03);
        }
        #hud .score-label {
            color: rgba(0, 255, 136, 0.6);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        #hud .score-value {
            font-size: 1.4rem;
        }
        #hud .high-score .score-value {
            color: #ffcc00;
            text-shadow: 0 0 10px rgba(255, 204, 0, 0.5);
        }

        /* ========== CANVAS CONTAINER ========== */
        #canvasContainer {
            position: relative;
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.2), 0 0 60px rgba(0, 255, 136, 0.1), inset 0 0 30px rgba(0, 255, 136, 0.05);
            border: 2px solid rgba(0, 255, 136, 0.3);
        }

        canvas {
            display: block;
            width: 500px;
            height: 500px;
            border-radius: 10px;
            background: #0d0d0d;
        }

        /* ========== GAME OVER OVERLAY ========== */
        #gameOverOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 10px;
            z-index: 10;
            gap: 12px;
        }
        #gameOverOverlay.active {
            display: flex;
        }

        #gameOverOverlay .go-title {
            font-size: 2.5rem;
            font-weight: bold;
            color: #ff3355;
            text-shadow: 0 0 20px rgba(255, 51, 85, 0.6);
            text-transform: uppercase;
            letter-spacing: 4px;
        }
        #gameOverOverlay .go-score {
            font-size: 1.2rem;
            color: #00ff88;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
        }
        #gameOverOverlay .go-highscore {
            font-size: 0.95rem;
            color: #ffcc00;
            text-shadow: 0 0 8px rgba(255, 204, 0, 0.4);
        }
        #gameOverOverlay .go-highscore.new {
            animation: newHighScore 0.6s ease-in-out infinite alternate;
        }

        #restartBtn {
            margin-top: 12px;
            padding: 14px 40px;
            font-size: 1.1rem;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            color: #0a0a0a;
            background: #00ff88;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 3px;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.4);
            transition: all 0.2s ease;
        }
        #restartBtn:hover {
            background: #33ffaa;
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.6);
            transform: scale(1.05);
        }
        #restartBtn:active {
            transform: scale(0.95);
        }

        #gameOverOverlay .go-hint {
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.8rem;
            margin-top: 4px;
        }

        /* ========== PAUSE INDICATOR ========== */
        #pauseIndicator {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 3rem;
            font-weight: bold;
            color: rgba(255, 255, 255, 0.3);
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.1);
            letter-spacing: 8px;
            text-transform: uppercase;
            display: none;
            z-index: 5;
            pointer-events: none;
        }
        #pauseIndicator.active {
            display: block;
        }

        /* ========== CONTROLS HINT ========== */
        #controlsHint {
            display: flex;
            gap: 16px;
            color: rgba(0, 255, 136, 0.3);
            font-size: 0.75rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        #controlsHint span {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        #controlsHint .key {
            display: inline-block;
            padding: 2px 8px;
            border: 1px solid rgba(0, 255, 136, 0.25);
            border-radius: 4px;
            font-size: 0.65rem;
            background: rgba(0, 255, 136, 0.05);
        }

        /* ========== ANIMATIONS ========== */
        @keyframes glowPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        @keyframes newHighScore {
            0% { color: #ffcc00; text-shadow: 0 0 8px rgba(255,204,0,0.4); }
            100% { color: #ffee66; text-shadow: 0 0 20px rgba(255,204,0,0.8), 0 0 40px rgba(255,204,0,0.4); }
        }

        /* ========== RESPONSIVE ========== */
        @media (max-width: 540px) {
            canvas {
                width: 90vw;
                height: 90vw;
            }
            #title { font-size: 1.4rem; letter-spacing: 3px; }
            #hud { font-size: 0.9rem; padding: 6px 10px; }
            #hud .score-value { font-size: 1.1rem; }
            #gameOverOverlay .go-title { font-size: 1.8rem; }
            #restartBtn { padding: 12px 30px; font-size: 0.95rem; }
        }

        @media (max-width: 380px) {
            canvas {
                width: 95vw;
                height: 95vw;
            }
            #title { font-size: 1.1rem; }
            #controlsHint { font-size: 0.6rem; gap: 8px; flex-wrap: wrap; justify-content: center; }
        }
    </style>
</head>
<body>
    <div id="gameWrapper">
        <div id="title">🐍 NEON SNAKE</div>

        <div id="hud">
            <div class="score">
                <div class="score-label">Score</div>
                <div class="score-value" id="scoreDisplay">0</div>
            </div>
            <div class="high-score">
                <div class="score-label">High Score</div>
                <div class="score-value" id="highScoreDisplay">0</div>
            </div>
        </div>

        <div id="canvasContainer">
            <canvas id="gameCanvas" width="500" height="500"></canvas>
            <div id="pauseIndicator">PAUSED</div>
            <div id="gameOverOverlay">
                <div class="go-title">GAME OVER</div>
                <div class="go-score">Score: <span id="finalScore">0</span></div>
                <div class="go-highscore" id="highScoreMsg">Best: <span id="finalHighScore">0</span></div>
                <button id="restartBtn">PLAY AGAIN</button>
                <div class="go-hint">Press SPACE or tap to restart</div>
            </div>
        </div>

        <div id="controlsHint">
            <span>⬆️ ⬇️ ⬅️ ➡️ <span class="key">Arrows</span></span>
            <span>🤚 <span class="key">Swipe</span></span>
            <span>⏸️ <span class="key">Space</span></span>
        </div>
    </div>

    <script>
        // ============================================================
        //  🐍 NEON SNAKE — Full Game Logic
        // ============================================================

        // ---------- DOM refs ----------
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const highScoreDisplay = document.getElementById('highScoreDisplay');
        const finalScore = document.getElementById('finalScore');
        const finalHighScore = document.getElementById('finalHighScore');
        const highScoreMsg = document.getElementById('highScoreMsg');
        const gameOverOverlay = document.getElementById('gameOverOverlay');
        const pauseIndicator = document.getElementById('pauseIndicator');
        const restartBtn = document.getElementById('restartBtn');

        // ---------- Constants ----------
        const GRID_SIZE = 20;
        const BASE_SPEED = 150;           // ms per tick at start
        const MIN_SPEED = 60;             // fastest possible
        const SPEED_STEP_EVERY = 5;       // speed up every N food eaten
        const SPEED_DECREASE = 8;         // ms faster per step

        // ---------- Game state ----------
        let snake, food, direction, nextDirection;
        let score, highScore;
        let speed;
        let isGameOver, isPaused, isPlaying;
        let lastUpdateTime;
        let particles;
        let animationId;
        let isNewHighScore;

        // Touch tracking
        let touchStartX = 0, touchStartY = 0;

        // Direction helpers
        const OPPOSITE = {
            'UP': 'DOWN',
            'DOWN': 'UP',
            'LEFT': 'RIGHT',
            'RIGHT': 'LEFT'
        };

        // ---------- Init ----------
        function init() {
            // Starting snake: 3 segments in the middle
            snake = [
                { x: 10, y: 10 },
                { x: 9, y: 10 },
                { x: 8, y: 10 }
            ];
            direction = 'RIGHT';
            nextDirection = 'RIGHT';
            score = 0;
            speed = BASE_SPEED;
            isGameOver = false;
            isPaused = false;
            isPlaying = true;
            particles = [];
            isNewHighScore = false;
            lastUpdateTime = 0;

            // Load high score
            try {
                highScore = parseInt(localStorage.getItem('snakeNeonHighScore')) || 0;
            } catch (e) {
                highScore = 0;
            }

            spawnFood();
            updateHUD();
            gameOverOverlay.classList.remove('active');
            pauseIndicator.classList.remove('active');
        }

        // ---------- Food spawning ----------
        function spawnFood() {
            let pos;
            do {
                pos = {
                    x: Math.floor(Math.random() * GRID_SIZE),
                    y: Math.floor(Math.random() * GRID_SIZE)
                };
            } while (isOnSnake(pos.x, pos.y));
            food = pos;
        }

        function isOnSnake(x, y) {
            return snake.some(seg => seg.x === x && seg.y === y);
        }

        // ---------- Movement ----------
        function moveSnake() {
            // Apply queued direction (if valid)
            if (nextDirection && OPPOSITE[nextDirection] !== direction) {
                direction = nextDirection;
            }

            // Calculate new head
            const head = snake[0];
            let newHead = { ...head };

            switch (direction) {
                case 'UP':    newHead.y--; break;
                case 'DOWN':  newHead.y++; break;
                case 'LEFT':  newHead.x--; break;
                case 'RIGHT': newHead.x++; break;
            }

            // Wall collision — game over
            if (newHead.x < 0 || newHead.x >= GRID_SIZE || newHead.y < 0 || newHead.y >= GRID_SIZE) {
                gameOver();
                return;
            }

            // Self collision — game over
            if (isOnSnake(newHead.x, newHead.y)) {
                gameOver();
                return;
            }

            // Move snake: add new head
            snake.unshift(newHead);

            // Check food
            if (newHead.x === food.x && newHead.y === food.y) {
                // Eat food: don't remove tail → snake grows
                score++;
                spawnParticles(food.x, food.y);
                spawnFood();

                // Speed up every SPEED_STEP_EVERY food
                if (score % SPEED_STEP_EVERY === 0) {
                    speed = Math.max(MIN_SPEED, speed - SPEED_DECREASE);
                }

                updateHUD();
            } else {
                // No food: remove tail
                snake.pop();
            }
        }

        // ---------- Particles ----------
        function spawnParticles(gridX, gridY) {
            const cellSize = canvas.width / GRID_SIZE;
            const cx = gridX * cellSize + cellSize / 2;
            const cy = gridY * cellSize + cellSize / 2;
            const colors = ['#00ff88', '#00ffaa', '#33ffbb', '#66ffcc', '#ffcc00', '#ff8800'];

            for (let i = 0; i < 15; i++) {
                const angle = (Math.PI * 2 / 15) * i + Math.random() * 0.3;
                const speed_val = 1.5 + Math.random() * 4;
                particles.push({
                    x: cx,
                    y: cy,
                    vx: Math.cos(angle) * speed_val,
                    vy: Math.sin(angle) * speed_val,
                    life: 1,
                    decay: 0.015 + Math.random() * 0.02,
                    size: 2 + Math.random() * 4,
                    color: colors[Math.floor(Math.random() * colors.length)]
                });
            }
        }

        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vx *= 0.97;
                p.vy *= 0.97;
                p.life -= p.decay;
                if (p.life <= 0) {
                    particles.splice(i, 1);
                }
            }
        }

        // ---------- Game Over ----------
        function gameOver() {
            isGameOver = true;
            isPlaying = false;

            // Check high score
            if (score > highScore) {
                highScore = score;
                isNewHighScore = true;
                try {
                    localStorage.setItem('snakeNeonHighScore', String(highScore));
                } catch (e) { /* ignore */ }
            }

            // Show overlay
            finalScore.textContent = score;
            finalHighScore.textContent = highScore;
            highScoreMsg.classList.toggle('new', isNewHighScore);
            highScoreMsg.textContent = isNewHighScore ? '🏆 NEW High Score!' : `Best: ${highScore}`;

            updateHUD();
            gameOverOverlay.classList.add('active');
        }

        // ---------- Restart ----------
        function restart() {
            if (animationId) {
                cancelAnimationFrame(animationId);
            }
            init();
            draw();
            gameLoop(0);
        }

        // ---------- HUD ----------
        function updateHUD() {
            scoreDisplay.textContent = score;
            highScoreDisplay.textContent = highScore;
        }

        // ---------- Drawing ----------
        function draw() {
            const w = canvas.width;
            const h = canvas.height;
            const cellSize = w / GRID_SIZE;

            // Clear
            ctx.fillStyle = '#0d0d0d';
            ctx.fillRect(0, 0, w, h);

            // --- Grid (subtle) ---
            ctx.strokeStyle = 'rgba(0, 255, 136, 0.04)';
            ctx.lineWidth = 0.5;
            for (let i = 0; i <= GRID_SIZE; i++) {
                ctx.beginPath();
                ctx.moveTo(i * cellSize, 0);
                ctx.lineTo(i * cellSize, h);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * cellSize);
                ctx.lineTo(w, i * cellSize);
                ctx.stroke();
            }

            // --- Food ---
            if (food) {
                const fx = food.x * cellSize + cellSize / 2;
                const fy = food.y * cellSize + cellSize / 2;
                const pulse = 1 + 0.15 * Math.sin(Date.now() / 200);

                // Glow
                const grad = ctx.createRadialGradient(fx, fy, 0, fx, fy, cellSize * 0.8 * pulse);
                grad.addColorStop(0, 'rgba(255, 60, 60, 0.4)');
                grad.addColorStop(0.5, 'rgba(255, 100, 50, 0.15)');
                grad.addColorStop(1, 'rgba(255, 100, 50, 0)');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(fx, fy, cellSize * 0.8 * pulse, 0, Math.PI * 2);
                ctx.fill();

                // Food circle
                ctx.shadowColor = '#ff4422';
                ctx.shadowBlur = 15;
                ctx.fillStyle = '#ff4422';
                ctx.beginPath();
                ctx.arc(fx, fy, cellSize * 0.3 * pulse, 0, Math.PI * 2);
                ctx.fill();

                // Inner highlight
                ctx.shadowBlur = 0;
                ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.beginPath();
                ctx.arc(fx - cellSize * 0.08, fy - cellSize * 0.08, cellSize * 0.1, 0, Math.PI * 2);
                ctx.fill();

                ctx.shadowBlur = 0;
            }

            // --- Snake ---
            for (let i = 0; i < snake.length; i++) {
                const seg = snake[i];
                const sx = seg.x * cellSize;
                const sy = seg.y * cellSize;
                const padding = 1;
                const size = cellSize - padding * 2;

                // Head has extra glow
                const isHead = i === 0;
                const intensity = 1 - (i / snake.length) * 0.5;
                const green = Math.round(136 + (120 * (1 - i / snake.length)));
                const color = `rgb(0, ${green}, 68)`;
                const glowColor = `rgba(0, ${green}, 68, ${0.4 * intensity})`;

                // Glow
                if (isHead) {
                    ctx.shadowColor = '#00ff88';
                    ctx.shadowBlur = 20;
                } else {
                    ctx.shadowColor = glowColor;
                    ctx.shadowBlur = 8 * intensity;
                }

                // Rounded rect
                const radius = isHead ? 5 : 3;
                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.roundRect(sx + padding, sy + padding, size, size, radius);
                ctx.fill();

                ctx.shadowBlur = 0;

                // Head details — eyes
                if (isHead) {
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
                    let eyeX1, eyeY1, eyeX2, eyeY2, eyeSize;

                    eyeSize = cellSize * 0.12;
                    const centerX = sx + cellSize / 2;
                    const centerY = sy + cellSize / 2;
                    const offset = cellSize * 0.18;

                    switch (direction) {
                        case 'UP':
                            eyeX1 = centerX - offset; eyeY1 = centerY - offset * 0.6;
                            eyeX2 = centerX + offset; eyeY2 = centerY - offset * 0.6;
                            break;
                        case 'DOWN':
                            eyeX1 = centerX - offset; eyeY1 = centerY + offset * 0.6;
                            eyeX2 = centerX + offset; eyeY2 = centerY + offset * 0.6;
                            break;
                        case 'LEFT':
                            eyeX1 = centerX - offset * 0.6; eyeY1 = centerY - offset;
                            eyeX2 = centerX - offset * 0.6; eyeY2 = centerY + offset;
                            break;
                        case 'RIGHT':
                            eyeX1 = centerX + offset * 0.6; eyeY1 = centerY - offset;
                            eyeX2 = centerX + offset * 0.6; eyeY2 = centerY + offset;
                            break;
                    }

                    ctx.beginPath();
                    ctx.arc(eyeX1, eyeY1, eyeSize, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(eyeX2, eyeY2, eyeSize, 0, Math.PI * 2);
                    ctx.fill();

                    // Pupils
                    ctx.fillStyle = '#0a0a0a';
                    const pupilSize = eyeSize * 0.5;
                    ctx.beginPath();
                    ctx.arc(eyeX1 + (direction === 'RIGHT' ? 1 : direction === 'LEFT' ? -1 : 0) * pupilSize * 0.3,
                            eyeY1 + (direction === 'DOWN' ? 1 : direction === 'UP' ? -1 : 0) * pupilSize * 0.3,
                            pupilSize, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(eyeX2 + (direction === 'RIGHT' ? 1 : direction === 'LEFT' ? -1 : 0) * pupilSize * 0.3,
                            eyeY2 + (direction === 'DOWN' ? 1 : direction === 'UP' ? -1 : 0) * pupilSize * 0.3,
                            pupilSize, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // --- Particles ---
            for (const p of particles) {
                ctx.globalAlpha = p.life;
                ctx.shadowColor = p.color;
                ctx.shadowBlur = 8;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;
            ctx.shadowBlur = 0;

            // --- Border glow ---
            ctx.strokeStyle = 'rgba(0, 255, 136, 0.1)';
            ctx.lineWidth = 1;
            ctx.strokeRect(0, 0, w, h);
        }

        // roundRect polyfill (for browsers that don't have it)
        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
                if (typeof r === 'number') r = [r];
                const radii = r.map(v => Math.min(v, Math.min(w, h) / 2));
                const tl = radii[0] || 0;
                this.moveTo(x + tl, y);
                this.lineTo(x + w - tl, y);
                this.quadraticCurveTo(x + w, y, x + w, y + tl);
                this.lineTo(x + w, y + h - tl);
                this.quadraticCurveTo(x + w, y + h, x + w - tl, y + h);
                this.lineTo(x + tl, y + h);
                this.quadraticCurveTo(x, y + h, x, y + h - tl);
                this.lineTo(x, y + tl);
                this.quadraticCurveTo(x, y, x + tl, y);
                this.closePath();
                return this;
            };
        }

        // ---------- Game Loop ----------
        function gameLoop(timestamp) {
            if (!isPlaying && !isGameOver) {
                animationId = requestAnimationFrame(gameLoop);
                return;
            }

            if (!isGameOver && !isPaused) {
                if (!lastUpdateTime) lastUpdateTime = timestamp;
                const delta = timestamp - lastUpdateTime;

                if (delta >= speed) {
                    moveSnake();
                    updateParticles();
                    lastUpdateTime = timestamp;
                }
            }

            draw();
            animationId = requestAnimationFrame(gameLoop);
        }

        // ---------- Input: Keyboard ----------
        document.addEventListener('keydown', (e) => {
            const key = e.key;

            // Space : pause / restart
            if (key === ' ' || key === 'Spacebar') {
                e.preventDefault();
                if (isGameOver) {
                    restart();
                    return;
                }
                isPaused = !isPaused;
                pauseIndicator.classList.toggle('active', isPaused);
                if (!isPaused) {
                    lastUpdateTime = 0;
                }
                return;
            }

            // Arrow keys
            const dirMap = {
                'ArrowUp': 'UP',
                'ArrowDown': 'DOWN',
                'ArrowLeft': 'LEFT',
                'ArrowRight': 'RIGHT'
            };
            if (dirMap[key] && !isGameOver && !isPaused) {
                e.preventDefault();
                const newDir = dirMap[key];
                if (OPPOSITE[newDir] !== direction) {
                    nextDirection = newDir;
                }
            }
        });

        // ---------- Input: Touch ----------
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            touchStartX = touch.clientX;
            touchStartY = touch.clientY;
        }, { passive: false });

        canvas.addEventListener('touchend', (e) => {
            e.preventDefault();
            if (isGameOver) {
                restart();
                return;
            }

            if (isPaused) {
                isPaused = false;
                pauseIndicator.classList.remove('active');
                lastUpdateTime = 0;
                return;
            }

            // Use the changed touch for accuracy
            const touch = e.changedTouches[0];
            const dx = touch.clientX - touchStartX;
            const dy = touch.clientY - touchStartY;
            const minSwipe = 30;

            if (Math.abs(dx) < minSwipe && Math.abs(dy) < minSwipe) {
                // Tap → pause toggle
                isPaused = !isPaused;
                pauseIndicator.classList.toggle('active', isPaused);
                if (!isPaused) lastUpdateTime = 0;
                return;
            }

            if (Math.abs(dx) > Math.abs(dy)) {
                const newDir = dx > 0 ? 'RIGHT' : 'LEFT';
                if (OPPOSITE[newDir] !== direction) {
                    nextDirection = newDir;
                }
            } else {
                const newDir = dy > 0 ? 'DOWN' : 'UP';
                if (OPPOSITE[newDir] !== direction) {
                    nextDirection = newDir;
                }
            }
        }, { passive: false });

        // Prevent scroll on touch within canvas
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
        }, { passive: false });

        // ---------- Restart button ----------
        restartBtn.addEventListener('click', restart);

        // ---------- Window resize (keep canvas crisp) ----------
        // Canvas resolution is fixed at 500×500; CSS handles display size.
        // No resize needed for pixel-perfect look.

        // ---------- Start the game ----------
        init();
        draw();
        gameLoop(0);
    </script>
</body>
</html>
