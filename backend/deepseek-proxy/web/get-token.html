<!DOCTYPE html>
<html>
<head><title>Get DeepSeek Token</title></head>
<body style="font-family: system-ui; padding: 2rem; max-width: 600px; margin: 0 auto;">
<h2>Extract DeepSeek Token</h2>
<p>This page reads your DeepSeek login token from the browser's localStorage.</p>

<button onclick="getToken()" style="padding: 8px 16px; font-size: 16px;">Extract Token</button>
<pre id="output" style="background: #f5f5f5; padding: 1rem; margin-top: 1rem; word-break: break-all; display: none;"></pre>

<script>
async function getToken() {
  const out = document.getElementById('output');
  out.style.display = 'block';
  
  try {
    // Try common token key names
    const keys = ['token', 'userToken', 'authToken', 'access_token', 'session_token', 'jwt_token'];
    let found = null;
    
    for (const key of keys) {
      try {
        const val = localStorage.getItem(key);
        if (val && val.length > 20) {
          found = { key, value: val };
          break;
        }
      } catch {}
    }
    
    if (found && found.key === 'userToken') {
      try {
        const parsed = JSON.parse(found.value);
        found.value = parsed.access_token || parsed.token || found.value;
      } catch {}
    }
    
    if (!found) {
      out.textContent = 'No token found. Keys checked: ' + keys.join(', ') + '\n\nAll localStorage keys: ' + Object.keys(localStorage).join(', ');
      return;
    }
    
    out.innerHTML = `<b>Found token in localStorage key: "${found.key}"</b>\n\n<textarea id="tok" style="width:100%;height:80px">${found.value}</textarea>\n\n<button onclick="copyToken()">Copy to Clipboard</button>`;
    
    // Also try to fetch a DeepSeek API test
    const testBtn = document.createElement('button');
    testBtn.textContent = 'Test Token';
    testBtn.onclick = async () => {
      testBtn.disabled = true;
      testBtn.textContent = 'Testing...';
      const resp = await fetch('https://chat.deepseek.com/api/v0/user/info', {
        headers: { 'Authorization': `Bearer ${found.value}` }
      });
      testBtn.textContent = `Response: ${resp.status}`;
      const data = await resp.text();
      out.innerHTML += `\n\nAPI Response (${resp.status}): ${data.substring(0, 500)}`;
    };
    out.appendChild(document.createElement('br'));
    out.appendChild(testBtn);
    
    window.copyToken = () => {
      const ta = document.getElementById('tok');
      ta.select();
      navigator.clipboard.writeText(ta.value);
    };
    
  } catch (e) {
    out.textContent = 'Error: ' + e.message;
  }
}
</script>
<p style="margin-top: 2rem; color: #666; font-size: 14px;">
<strong>Note:</strong> You must be logged into <strong>chat.deepseek.com</strong> in this browser.
This page <em>cannot</em> be served from DeepSeek itself (CORS). Save it locally and open directly.
</p>
</body>
</html>
