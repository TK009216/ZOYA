<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZOYA - DeepSeek Proxy Chat</title>
<link rel="stylesheet" href="/web/style.css">
</head>
<body>
<div id="app">
  <header>
    <div class="header-title">ZOYA <span class="subtitle">DeepSeek Proxy</span></div>
    <div class="header-info">
      <span id="status-badge" class="status-badge">● Checking...</span>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-section">
        <label class="section-label">Model</label>
        <select id="model-select" class="model-select">
          <option value="deepseek-flash">⚡ DeepSeek Flash V4</option>
          <option value="deepseek-pro" selected>🔷 DeepSeek Pro V4</option>
          <option value="deepseek-r1">🧠 DeepSeek R1 Reasoning</option>
        </select>
      </div>

      <div class="sidebar-section">
        <label class="section-label">API Key</label>
        <input type="text" id="api-key-input" class="api-key-input" placeholder="sk-..." value="sk-zoya-test-key-2026" />
      </div>

      <div class="sidebar-section">
        <label class="section-label">
          <input type="checkbox" id="stream-toggle" checked />
          Streaming
        </label>
      </div>

      <div class="sidebar-section">
        <label class="section-label">Actions</label>
        <button id="clear-btn" class="btn btn-secondary">Clear Chat</button>
        <button id="copy-last-btn" class="btn btn-secondary">Copy Last</button>
      </div>

      <div class="sidebar-section stats">
        <div class="stat"><span class="stat-label">Model:</span> <span id="stat-model">-</span></div>
        <div class="stat"><span class="stat-label">Tokens:</span> <span id="stat-tokens">-</span></div>
        <div class="stat"><span class="stat-label">Time:</span> <span id="stat-time">-</span></div>
      </div>

      <div class="sidebar-section server-status">
        <div class="stat"><span class="stat-label">Proxy:</span> <span id="proxy-status">-</span></div>
        <div class="stat"><span class="stat-label">Backend:</span> <span id="backend-status">-</span></div>
      </div>
    </aside>

    <main class="chat-area">
      <div id="messages" class="messages"></div>

      <div class="input-area">
        <textarea id="prompt-input" class="prompt-input" placeholder="Type your message..." rows="3"></textarea>
        <button id="send-btn" class="btn btn-primary">Send</button>
        <button id="stop-btn" class="btn btn-danger" style="display:none">Stop</button>
      </div>

      <div class="examples">
        <span class="example-chip" data-prompt="Explain quantum computing in simple terms">Quantum?</span>
        <span class="example-chip" data-prompt="Write a Python function to sort a list">Python sort</span>
        <span class="example-chip" data-prompt="What is the meaning of life?">Life?</span>
        <span class="example-chip" data-prompt="Write a Shakespearean sonnet about AI">AI sonnet</span>
      </div>
    </main>
  </div>
</div>

<script type="module" src="/web/chat.js"></script>
</body>
</html>
